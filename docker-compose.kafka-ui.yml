services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-aiven
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "Aiven Kafka"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: "SASL_SSL"
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: "PLAIN"
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_USERNAME}\" password=\"${KAFKA_PASSWORD}\";"
      KAFKA_CLUSTERS_0_READONLY: "false"
    restart: unless-stopped
