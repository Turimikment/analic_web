    <style>
        body {
            font-family: 'Verdana';
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f8ff;
        }
        h1 {
            color: #2c5f2d;
            text-align: center;
            text-shadow: 2px 2px 4px #a8dba8;
        }
        .section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .method {
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #2c5f2d;
            background: #f9fff9;
        }
        .rest { border-color: #4CAF50; }
        .soap { border-color: #2196F3; }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            color: white;
            font-weight: bold;
        }
        .get { background: #4CAF50; }
        .post { background: #FF9800; }
        .put { background: #2196F3; }
        .soap-badge { background: #9C27B0; }
    </style>

<div style="text-align: center; margin: 40px 0;">
    <a href="/apidocs/" 
       style="
           display: inline-block;
           padding: 25px 50px;
           background: linear-gradient(145deg, #FF9800, #FF5722);
           color: white !important;
           border-radius: 35px;
           text-decoration: none;
           font-size: 1.8em;
           transition: all 0.4s;
           border: 3px solid #F57C00;
           box-shadow: 0 8px 15px rgba(255, 87, 34, 0.3);
           text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
           position: relative;
           overflow: hidden;
       "
       onmouseover="this.style.transform='rotate(-2deg) scale(1.05)'"
       onmouseout="this.style.transform='none'">
       
       <span style="display: block; margin-bottom: 10px;">🐇🥕</span>
       ПОПРОБУЙ REST API!
       
       <!-- Анимированная подсветка -->
       <div style="
           position: absolute;
           top: -50%;
           left: -50%;
           width: 200%;
           height: 200%;
           background: linear-gradient(45deg, 
               transparent 25%,
               rgba(255,255,255,0.2) 50%,
               transparent 75%
           );
           animation: shine 3s infinite;
       "></div>
    </a>
</div>

<style>
    @keyframes shine {
        0% { transform: translateX(-100%) rotate(45deg); }
        100% { transform: translateX(100%) rotate(45deg); }
    }
</style>
