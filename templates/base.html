<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебный портал для зайцев - REST/SOAP API</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            margin: 20px;
            background: #FFF3E0;
        }
        
        .task-container {
            max-width: 800px;
            margin: 80px auto 40px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.2);
            position: relative;
        }
        
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #FF9800;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s;
        }
        
        .btn-back:hover {
            background: #F57C00;
            transform: scale(1.05);
        }
        
        .task-title {
            color: #FF9800;
            font-size: 2.2em;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px #FFE0B2;
        }
        
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin: 40px 0;
        }
        
        .option-card {
            padding: 30px;
            background: #FFF8E1;
            border-radius: 15px;
            border: 2px dashed #FFB74D;
            transition: all 0.3s;
            cursor: pointer;
            text-align: left;
        }
        
        .option-card:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.3);
        }
        
        .option-card h3 {
            color: #E64A19;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .option-icon {
            font-size: 2em;
            margin-right: 15px;
        }
        
        .option-content {
            display: flex;
            align-items: center;
        }
        
        .option-text {
            flex: 1;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(145deg, #FF9800, #F57C00);
            color: white !important;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1.2em;
            margin: 15px 0;
            transition: 0.3s;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: rotate(-3deg) scale(1.05);
        }
        
        .btn-success {
            background: linear-gradient(145deg, #4CAF50, #2c5f2d);
        }
    </style>
</head>
<body>
    <div class="task-container">
        <a href="/" class="btn-back">← Назад</a>
        
        <h1 class="task-title">🪣 Песочница API</h1>
        
        <div class="options-grid">
            <div class="option-card" onclick="location.href='/apidocs/'">
                <div class="option-content">
                    <div class="option-icon">📡</div>
                    <div class="option-text">
                        <h3>REST API</h3>
                        <p>Используйте Swagger UI для изучения REST API</p>
                    </div>
                </div>
            </div>
            
            <div class="option-card" onclick="window.open('/soap?wsdl', '_blank')">
                <div class="option-content">
                    <div class="option-icon">🧼</div>
                    <div class="option-text">
                        <h3>SOAP API</h3>
                        <p>Используйте WSDL для работы с SOAP сервисом</p>
                    </div>
                </div>
            </div>
            
            <div class="option-card" onclick="location.href='/admin/view-db'">
                <div class="option-content">
                    <div class="option-icon">🗄️</div>
                    <div class="option-text">
                        <h3>База данных</h3>
                        <p>Просмотр содержимого базы данных</p>
                    </div>
                </div>
            </div>
            
            <div class="option-card" onclick="location.href='/search-holidays'">
                <div class="option-content">
                    <div class="option-icon">🎉</div>
                    <div class="option-text">
                        <h3>Поиск праздников</h3>
                        <p>Поиск с использованием клиентского кэширования</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
