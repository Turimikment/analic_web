<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морковный Университет - Главная</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            background: #FFF3E0;
        }
        
        .user-header {
            background: #FF9800;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        
        .user-header .username {
            font-size: 1.4em;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
        }
        
        .user-header .logout-btn {
            background: #F57C00;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .user-header .logout-btn:hover {
            background: #E65100;
            transform: scale(1.05);
        }
        
        .welcome-container {
            max-width: 800px;
            margin: 100px auto 40px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.2);
            text-align: center;
        }
        
        .welcome-title {
            color: #FF9800;
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 2px 2px #FFE0B2;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .option-card {
            padding: 30px;
            background: #FFF8E1;
            border-radius: 15px;
            border: 2px dashed #FFB74D;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .option-card:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.3);
        }
        
        .option-card h3 {
            color: #E64A19;
            margin-top: 15px;
        }
        
        .option-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="user-header">
        <div class="username">🐇 Зайчонок: {{ username }}</div>
        <a href="{{ url_for('main.logout') }}" class="logout-btn">Выйти из норки</a>
    </div>

    <div class="welcome-container">
        <h1 class="welcome-title">🐇 Добро пожаловать в норку, {{ username }}! 🥕</h1>
        
        <div class="options-grid">
            <div class="option-card" onclick="location.href='/pipeline'">
                <div class="option-icon">🥕</div>
                <h3>Обучение</h3>
                <p>Изучи основы REST и SOAP API</p>
            </div>
            
            <div class="option-card" onclick="location.href='/docs'">
                <div class="option-icon">📚</div>
                <h3>Документация</h3>
                <p>Подробное руководство по API</p>
            </div>
            
            <div class="option-card" onclick="location.href='/base'">
                <div class="option-icon">🪣</div>
                <h3>Песочница</h3>
                <p>Экспериментируй с API</p>
            </div>
        </div>
    </div>
</body>
</html>
