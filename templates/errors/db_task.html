<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База данных 🗄️</title>
<style>
        body {
            font-family: 'Courier New', monospace;
            margin: 20px;
            background: #FFF3E0;
        }
        .task-container {
            max-width: 800px;
            margin: 80px auto 40px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.2);
        }
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #FF9800;
            color: white;
            border-radius: 10px;
            text-decoration: none;
        }
        .instruction {
            background: #E8F5E9;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #4CAF50;
        }
        .step-number {
            background: #FF9800;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <a href="/course" class="btn-back">← Назад к курсу</a>
    
    <div class="task-container">
        <h1>🗄️ Задание с базой данных</h1>
        <p>Скоро здесь появится новое задание!</p>
        <div class="instruction">
            <p>В разработке...</p>
        </div>
    </div>
</body>
</html>
