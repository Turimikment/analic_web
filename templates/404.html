
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - Морковный Университет</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #FFF3E0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        
        .error-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.2);
            max-width: 600px;
            margin: 20px;
        }
        
        h1 {
            color: #FF9800;
            font-size: 2.5em;
            text-shadow: 2px 2px #FFE0B2;
            margin-bottom: 30px;
        }
        
        p {
            font-size: 1.2em;
            color: #5D4037;
            margin-bottom: 30px;
        }
        
        .home-link {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(145deg, #FF9800, #F57C00);
            color: white !important;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            border: 2px solid #F57C00;
        }
        
        .home-link:hover {
            background: #F57C00;
            transform: rotate(-3deg) scale(1.05);
        }
        
        .error-icon {
            font-size: 5em;
            margin-bottom: 20px;
            color: #E64A19;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🥕❌🐇</div>
        <h1>404 - Страница потерялась!</h1>
        <p>Похоже, эта морковка спряталась слишком глубоко в норке.</p>
        <p>Попробуйте вернуться на главную страницу и поискать оттуда.</p>
        <a href="/" class="home-link">Вернуться в главную норку</a>
    </div>
</body>
</html>
