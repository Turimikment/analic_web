<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика морковок - Redis</title>
    <style>
        body {
            font-family: 'Verdana';
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff8f0;
        }
        h1 {
            color: #e67e22;
            text-align: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        .stat-card {
            background: #f9f4e6;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            width: 200px;
            box-shadow: 0 4px 8px rgba(230, 126, 34, 0.2);
            margin: 10px;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #e67e22;
            margin: 10px 0;
        }
        .stat-label {
            color: #d35400;
        }
        .carrot {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            background: #e67e22;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-size: 1em;
            margin: 10px 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #d35400;
        }
        .top-carrots {
            margin-top: 30px;
        }
        .top-list {
            list-style-type: none;
            padding: 0;
        }
        .top-list li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .top-list li:last-child {
            border-bottom: none;
        }
        .carrot-count {
            background: #f39c12;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px;
            background: #2ecc71;
            color: white;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translateX(200%);
            transition: transform 0.3s ease-out;
        }
        .notification.show {
            transform: translateX(0);
        }
        .notification.error {
            background: #e74c3c;
        }
        @media (max-width: 600px) {
            .stats-box {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <h1>🥕 Статистика собранных морковок</h1>
    
    <div class="notification" id="notification"></div>
    
    <div class="container">
        <div class="stats-box">
            <div class="stat-card">
                <div class="carrot">🥕</div>
                <div class="stat-value" id="total-carrots">0</div>
                <div class="stat-label">Всего собрано</div>
            </div>
            
            <div class="stat-card">
                <div class="carrot">🏆</div>
                <div class="stat-value" id="top-user">0</div>
                <div class="stat-label">Рекорд за день</div>
            </div>
            
            <div class="stat-card">
                <div class="carrot">⏱️</div>
                <div class="stat-value" id="avg-time">0с</div>
                <div class="stat-label">Среднее время</div>
            </div>
        </div>
        
        <div style="text-align: center;">
            <button class="btn" id="collect-btn">Собрать морковку!</button>
            <button class="btn" id="reset-btn">Сбросить статистику</button>
        </div>
        
        <div class="top-carrots">
            <h2>Топ-5 зайцев сегодня</h2>
            <ul class="top-list" id="top-list">
                <li>Данные загружаются...</li>
            </ul>
        </div>
    </div>

    <script>
        // Функция для показа уведомлений
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification';
            
            if (isError) {
                notification.classList.add('error');
            }
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // Функция для обновления статистики
        async function updateStats() {
            try {
                const response = await fetch('/redis-stats/data');
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('total-carrots').textContent = data.total_carrots;
                    document.getElementById('top-user').textContent = data.top_user;
                    document.getElementById('avg-time').textContent = data.avg_time + 'с';
                    
                    // Обновляем топ-лист
                    const topList = document.getElementById('top-list');
                    topList.innerHTML = '';
                    
                    if (data.top_users && data.top_users.length > 0) {
                        data.top_users.forEach(user => {
                            const li = document.createElement('li');
                            li.innerHTML = `<span>${user.username}</span> <span class="carrot-count">${user.carrots} 🥕</span>`;
                            topList.appendChild(li);
                        });
                    } else {
                        topList.innerHTML = '<li>Пока никто не собрал морковок</li>';
                    }
                } else {
                    showNotification('Ошибка при загрузке данных', true);
                }
            } catch (error) {
                console.error('Ошибка при получении данных:', error);
                showNotification('Ошибка сети: ' + error.message, true);
            }
        }
        
        // Собрать морковку
        document.getElementById('collect-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/redis-stats/collect', { method: 'POST' });
                const result = await response.json();
                
                if (response.ok) {
                    showNotification(result.message);
                    updateStats();
                } else {
                    showNotification(result.message || 'Ошибка при сборе морковки', true);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showNotification('Ошибка сети: ' + error.message, true);
            }
        });
        
        // Сбросить статистику
        document.getElementById('reset-btn').addEventListener('click', async () => {
            if (confirm('Вы уверены, что хотите сбросить всю статистику по морковкам?')) {
                try {
                    const response = await fetch('/redis-stats/reset', { method: 'POST' });
                    const result = await response.json();
                    
                    if (response.ok) {
                        showNotification(result.message);
                        updateStats();
                    } else {
                        showNotification(result.message || 'Ошибка при сбросе статистики', true);
                    }
                } catch (error) {
                    console.error('Ошибка:', error);
                    showNotification('Ошибка сети: ' + error.message, true);
                }
            }
        });
        
        // Первоначальная загрузка данных
        updateStats();
        
        // Периодическое обновление статистики
        setInterval(updateStats, 10000); // Каждые 10 секунд
    </script>
</body>
</html>
