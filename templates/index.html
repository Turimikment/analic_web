<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морковный Университет - Вход</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #FFF3E0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #FF9800;
            font-size: 2.2em;
            text-shadow: 2px 2px #FFE0B2;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #5D4037;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #FFB74D;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        
        .error {
            color: #D32F2F;
            background: #FFEBEE;
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
            border: 1px dashed #EF9A9A;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(145deg, #FF9800, #F57C00);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🐇 Морковный Университет 🥕</h1>
        </div>
        
        <form method="POST" action="{{ url_for('main.login') }}">
            <div class="form-group">
                <label>📛 Кличка зайца:</label>
                <input type="text" name="username" required>
            </div>
            
            <div class="form-group">
                <label>🔑 Секретный пароль:</label>
                <input type="password" name="password" required>
            </div>
            
            {% if error %}
            <div class="error">
                ⚠️ {{ error }}
            </div>
            {% endif %}
            
            <button type="submit">Войти в норку</button>
        </form>
        
        <div class="register-link">
            <p>Ещё не зайчонок? <a href="{{ url_for('main.create_user') }}">Вырасти себя</a></p>
        </div>
    </div>
</body>
</html>
