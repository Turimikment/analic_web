 
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥕 Обучающий курс API 🐇</title>
    <style>
        /* Сохраняем существующие стили и добавляем новые */
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        .course-card {
            padding: 25px;
            background: #FFF8E1;
            border-radius: 15px;
            border: 2px solid #FFB74D;
            text-align: center;
            transition: all 0.3s;
        }
        .course-card:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }
        .course-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #FF9800;
            color: white;
            border-radius: 10px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="pipeline-container">
        <a href="/course" class="btn-back">← Назад</a>
        <h1 class="pipeline-title">🥕 Обучающий курс API 🐇</h1>
        
        <div class="course-grid">
            <div class="course-card" onclick="location.href='/course/rest'">
                <div class="course-icon">📡</div>
                <h3>REST API</h3>
                <p>Изучите основы REST API</p>
            </div>
            
            <div class="course-card" onclick="location.href='/course/soap'">
                <div class="course-icon">🧼</div>
                <h3>SOAP API</h3>
                <p>Работа с SOAP сервисами</p>
            </div>
            
            <div class="course-card" onclick="location.href='/course/db'">
                <div class="course-icon">🗄️</div>
                <h3>Базы данных</h3>
                <p>Изучение работы с БД</p>
            </div>
        </div>
    </div>
</body>
</html>
